[project]
name = "geumeum-backend"
version = "0.1.0"
description = "Geumeum local account service"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "argon2-cffi>=23.1,<26",
  "httpx>=0.28,<1",
  "discord.py>=2.6,<3",
  "cryptography>=46,<49",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geumeum_backend"]

[project.scripts]
geumeum-api = "geumeum_backend.cli:serve"
geumeum-admin = "geumeum_backend.cli:main"
geumeum-game-worker = "geumeum_backend.game_worker:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
