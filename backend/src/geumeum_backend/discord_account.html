<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>그믐 · 계정 설정</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#11141b;color:#f0f1f4}
body{max-width:560px;margin:6vh auto;padding:24px}h1{font-size:32px}p{line-height:1.7;color:#bfc8d8}
form{background:#1c2230;padding:26px;border:1px solid #39445a;border-radius:16px}
label{display:block;margin:18px 0 8px}input,select,button{box-sizing:border-box;width:100%;padding:12px;border:1px solid #596883;border-radius:8px;background:#111722;color:#fff;font:inherit}
button{margin-top:24px;background:#7366cd;cursor:pointer}button:disabled{opacity:.5}#result{white-space:pre-wrap}small{color:#bfc8d8}
</style>
<h1>그믐 계정 설정</h1>
<p>Discord에서 발급한 링크로 본인 계정을 설정합니다.<br>링크는 5분 동안 한 번만 사용할 수 있습니다.</p>
<p id="profile"></p>
<form id="form" hidden>
<label for="action">작업</label><select id="action"></select>
<div id="login-row"><label for="login">아이디</label><input id="login" autocomplete="username" minlength="4" maxlength="24" pattern="[A-Za-z0-9_]{4,24}"><small>영문·숫자·밑줄 4~24자</small></div>
<div id="nick-row"><label for="nickname">닉네임</label><input id="nickname" minlength="2" maxlength="16" autocomplete="nickname"></div>
<div id="pass-row"><label id="pass-label" for="password">비밀번호</label><input id="password" type="password" maxlength="128" autocomplete="current-password"></div>
<div id="new-row"><label for="new-password">새 비밀번호</label><input id="new-password" type="password" maxlength="128" autocomplete="new-password"></div>
<div id="confirm-row"><label for="confirm">비밀번호 확인</label><input id="confirm" type="password" maxlength="128" autocomplete="new-password"></div>
<p id="hint"></p><button id="save">저장</button>
</form><p id="result" role="status">링크를 확인하는 중입니다.</p>
<p><small>공식 Discord 서버의 /계정 명령으로 발급한 링크를 사용하세요. 비밀번호는 이 설정 페이지에만 입력하세요.</small></p>
<script src="/discord/account.js"></script></html>
